services:

  aria-neo4j:
    image: neo4j:5-community
    container_name: aria-neo4j
    ports:
      - "4474:7474"
      - "4687:7687"
    environment:
      - NEO4J_AUTH=neo4j/aria1234!
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1G
    volumes:
      - aria_neo4j_data:/data
      - aria_neo4j_logs:/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s

  aria-backend:
    build: ./backend
    container_name: aria-backend
    ports:
      - "4001:4001"
    environment:
      - NEO4J_URI=bolt://aria-neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aria1234!
      # Set ARIA_API_KEY to enable auth. Leave blank for open/dev mode.
      - ARIA_API_KEY=${ARIA_API_KEY:-}
      # AWS Bedrock credentials (set in .env file alongside docker-compose.yml)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-global.anthropic.claude-sonnet-4-6}
    depends_on:
      aria-neo4j:
        condition: service_healthy
    restart: unless-stopped

  aria-frontend:
    build: ./frontend
    container_name: aria-frontend
    ports:
      - "4000:80"
    depends_on:
      - aria-backend
    restart: unless-stopped

volumes:
  aria_neo4j_data:
  aria_neo4j_logs:
